<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copias y Sistemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="form-card">
        <div class="text-center mb-4">
            <h2 class="titulo-principal">Información de copias y sistemas</h2>
            <p class="subtitulo">Completa la información final antes de guardar la licencia</p>
        </div>

        <form action="/guardar" method="POST">
            <input type="hidden" name="id_solicitud" value="{{ id_solicitud }}">
            <input type="hidden" name="encargado" value="{{ encargado }}">
            <input type="hidden" name="area" value="{{ area }}">
            <input type="hidden" name="subarea" value="{{ subarea }}">
            <input type="hidden" name="fecha_hora" value="{{ fecha_hora }}">
            <input type="hidden" name="solicitante" value="{{ solicitante }}">
            <input type="hidden" name="licencia" value="{{ licencia }}">
            <input type="hidden" name="uso" value="{{ uso }}">
            <input type="hidden" name="tipo_herramienta" value="{{ tipo_herramienta }}">
            <input type="hidden" name="herramienta_detalle" value="{{ herramienta_detalle }}">
            <input type="hidden" name="licenciamiento" value="{{ licenciamiento }}">
            <input type="hidden" name="modo_licenciamiento" value="{{ modo_licenciamiento }}">
            <input type="hidden" name="proveedor" value="{{ proveedor }}">
            <input type="hidden" name="frecuencia" value="{{ frecuencia }}">
            <input type="hidden" name="frecuencia_otro" value="{{ frecuencia_otro }}">
            <input type="hidden" name="vigencia" value="{{ vigencia }}">
            <input type="hidden" name="usuarios" value="{{ usuarios }}">
            <input type="hidden" name="observaciones" value="{{ observaciones }}">
            <input type="hidden" name="usuarios_area" value="{{ usuarios_area }}">
            <input type="hidden" name="roles" value="{{ roles }}">
            <input type="hidden" name="gestiona_roles" value="{{ gestiona_roles }}">
            <input type="hidden" name="gestiona_usuarios" value="{{ gestiona_usuarios }}">
            <input type="hidden" name="info_sensible" value="{{ info_sensible }}">
            <input type="hidden" name="tipo_info_sensible" value="{{ tipo_info_sensible }}">
            <input type="hidden" name="info_sensible_otro" value="{{ info_sensible_otro }}">
            <input type="hidden" name="compliance_validado" value="{{ compliance_validado }}">

            <div class="mb-3">
                <label class="form-label">¿Sabes si la herramienta realiza copias de seguridad de la información?</label>
                <select id="copias_select" name="copias_seguridad" class="form-select custom-input" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Si">Si</option>
                    <option value="No">No</option>
                    <option value="No sé">No sé</option>
                </select>
            </div>

            <div id="copias_detalle_group" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">¿Qué tipo de copias de seguridad maneja?</label>
                    <input type="text" id="tipo_copias" name="tipo_copias" class="form-control custom-input" placeholder="Describe el tipo de copias de seguridad">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">¿Con qué frecuencia se generan las copias de seguridad?</label>
                    <select id="frecuencia_copias" name="frecuencia" class="form-select custom-input" required>
                        <option value="" disabled selected>Selecciona una frecuencia</option>
                        <option value="En todo momento">En todo momento</option>
                        <option value="Diario">Diario</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Mensual">Mensual</option>
                        <option value="Trimestral">Trimestral</option>
                        <option value="Semestral">Semestral</option>
                        <option value="Anual">Anual</option>
                        <option value="Otro">Otro</option>
                    </select>
            </div>

            <div class="mb-3" id="frecuencia_otro_group" style="display: none;">
                <label class="form-label">Si elegiste otro, especifica la frecuencia</label>
                <input type="text" id="frecuencia_otro_input" name="frecuencia_otro" class="form-control custom-input" placeholder="Describe la frecuencia" />
            </div>
                
                <div class="mb-3">
                    <label class="form-label">¿Dónde se alojan las copias de seguridad?</label>
                    <input type="text" id="ubicacion_copias" name="ubicacion_copias" class="form-control custom-input" placeholder="Ubicación de las copias de seguridad">
                </div>

            <div class="mb-3">
                <label class="form-label">¿Sabes si la herramienta se integra con otros sistemas de información internos o externos?</label>
                <select id="integracion_select" name="integracion_sistemas" class="form-select custom-input" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Si">Si</option>
                    <option value="No">No</option>
                    <option value="No sé">No sé</option>
                </select>
            </div>

            <div id="integracion_detalle_group" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">Relaciona los sistemas con los que se genera actualmente integración</label>
                    <input type="text" id="sistemas_integracion" name="sistemas_integracion" class="form-control custom-input" placeholder="Describe los sistemas integrados">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">¿Qué impacto tendría que la herramienta fallara?</label>
                <select name="criticidad" class="form-select custom-input" required>
                    <option value="" disabled selected>Selecciona una criticidad</option>
                    <option value="Alta - Paraliza operación">Alta - Paraliza operación</option>
                    <option value="Media - Afecta parcialmente">Media - Afecta parcialmente</option>
                    <option value="Baja - Impacto menor">Baja - Impacto menor</option>
                    <option value="No crítico">No crítico</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">En caso tal que la herramienta genere/gestione información que apoya a otros procesos de la compañía, por favor relaciona cuáles</label>
                <input type="text" name="procesos_apoyo" class="form-control custom-input" placeholder="Procesos que soporta la herramienta">
            </div>

            <div class="mb-3">
                <label class="form-label">Si requerimos alguna gestión particular, y la herramienta no es suministrada por TI de Megalabs, por favor relaciona datos de contacto del proveedor</label>
                <input type="text" name="contacto_proveedor" class="form-control custom-input" placeholder="Datos de contacto del proveedor">
            </div>

            <button type="submit" class="btn btn-success btn-custom w-100">Guardar licencia</button>
        </form>
    </div>
</div>

<script>
    const copiasSelect = document.getElementById('copias_select');
    const copiasDetalleGroup = document.getElementById('copias_detalle_group');
    const tipoCopiasInput = document.getElementById('tipo_copias');
    const frecuenciaCopiasInput = document.getElementById('frecuencia_copias');
    const ubicacionCopiasInput = document.getElementById('ubicacion_copias');
    const frecuenciaSelect = document.getElementById('frecuencia_copias');

    const integracionSelect = document.getElementById('integracion_select');
    const integracionDetalleGroup = document.getElementById('integracion_detalle_group');
    const sistemasIntegracionInput = document.getElementById('sistemas_integracion');

    function toggleCopiasDetalle() {
        const show = copiasSelect.value === 'Si';
        copiasDetalleGroup.style.display = show ? 'block' : 'none';
        tipoCopiasInput.required = show;
        frecuenciaSelect.required = show;
        ubicacionCopiasInput.required = show;
        if (!show) {
            tipoCopiasInput.value = '';
            frecuenciaSelect.value = '';
            ubicacionCopiasInput.value = '';
        }
    }

    function toggleIntegracionDetalle() {
        const show = integracionSelect.value === 'Si';
        integracionDetalleGroup.style.display = show ? 'block' : 'none';
        sistemasIntegracionInput.required = show;
        if (!show) {
            sistemasIntegracionInput.value = '';
        }
    }

    if (copiasSelect) {
        copiasSelect.addEventListener('change', toggleCopiasDetalle);
        toggleCopiasDetalle();
    }

    if (integracionSelect) {
        integracionSelect.addEventListener('change', toggleIntegracionDetalle);
        toggleIntegracionDetalle();
    }
</script>

</body>
</html>
