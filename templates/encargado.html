<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Licencias</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="form-card">

        <div class="text-center mb-4">
            <div class="title-with-logo">
                <img src="{{ url_for('static', filename='logomega.png') }}" alt="Logo" class="title-logo">
                <h1 class="titulo-principal mb-0">
                    Gestión de Licencias
                </h1>
            </div>

            <p class="subtitulo mt-2">
                Registro de herramientas y licencias empresariales
            </p>
            
        </div>

        <form action="{{ url_for('formulario_licencia') }}" method="POST">


            <!-- FECHA Y HORA -->
            <div class="mb-3">
                <label class="form-label">
                    Fecha y hora de la solicitud
                </label>

                <input
                    type="datetime-local"
                    id="fecha_hora"
                    name="fecha_hora"
                    class="form-control custom-input"
                    readonly
                    required
                >

                <div class="form-text">Se completa automáticamente con la fecha y hora actual.</div>
            </div>

            <!-- ÁREA -->
            <div class="mb-3">
                <label class="form-label">
                    Área / Departamento
                </label>

                <select
                    id="area_select"
                    name="area"
                    class="form-select custom-input"
                    required
                >
                    <option value="" disabled selected>Selecciona un Área</option>
                    <option value="Primary Care">Primary Care</option>
                    <option value="Consumer care">Consumer care</option>
                    <option value="Comercial">Comercial</option>
                    <option value="Departamento Médico">Departamento Médico</option>
                    <option value="BI">BI</option>
                    <option value="Gestión de riesgos">Gestión de riesgos</option>
                    <option value="Investigación y desarrollo">Investigación y desarrollo</option>
                    <option value="Institucional">Institucional</option>
                    <option value="Asuntos regulatorios">Asuntos regulatorios</option>
                    <option value="Producción">Producción</option>
                    <option value="Aseguramiento de la calidad">Aseguramiento de la calidad</option>
                    <option value="Calidad">Calidad</option>
                    <option value="Administración y Finanzas">Administración y Finanzas</option>
                </select>
            </div>

            <!-- SUBÁREA -->
            <div class="mb-3" id="subarea_group" style="display: none;">
                <label class="form-label">
                    Subárea
                </label>

                <input
                    type="text"
                    id="subarea_input"
                    name="subarea"
                    class="form-control custom-input"
                    placeholder="Escribe a cuál subárea pertenece"
                >
            </div>

            <!-- ENCARGADO -->
            <div class="mb-3">
                <label class="form-label">
                    Nombre del jefe encargado del área
                </label>

                <input
                    type="text"
                    name="encargado"
                    class="form-control custom-input"
                    required
                >
            </div>

            

            <!-- SOLICITANTE -->
            <div class="mb-4">
                <label class="form-label">
                    Persona que diligencia la solicitud
                </label>

                <input
                    type="text"
                    name="solicitante"
                    class="form-control custom-input"
                    required
                >
            </div>

            <!-- BOTÓN -->
            <button
                type="submit"
                class="btn btn-primary btn-custom w-100"
            >
                Continuar
            </button>

        </form>

    </div>

</div>

<script>
    const fechaInput = document.getElementById('fecha_hora');
    if (fechaInput) {
        const now = new Date();
        const pad = (n) => n.toString().padStart(2, '0');
        const localDatetime = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
        fechaInput.value = localDatetime;
    }

    const areaSelect = document.getElementById('area_select');
    const subareaGroup = document.getElementById('subarea_group');
    const subareaInput = document.getElementById('subarea_input');

    function toggleSubareaField() {
        if (!areaSelect || !subareaGroup || !subareaInput) {
            return;
        }

        const subareaAreas = [
            'Primary Care',
            'Consumer care',
            'Comercial',
            'Investigación y desarrollo',
            'Institucional',
            'Administración y Finanzas'
        ];

        const shouldShow = subareaAreas.includes(areaSelect.value);
        subareaGroup.style.display = shouldShow ? 'block' : 'none';
        subareaInput.required = shouldShow;

        if (!shouldShow) {
            subareaInput.value = '';
        }
    }

    if (areaSelect) {
        areaSelect.addEventListener('change', toggleSubareaField);
        toggleSubareaField();
    }
</script>

</body>
</html>
