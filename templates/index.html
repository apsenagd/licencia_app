<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Licencias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4 text-center">Registro de Licencias</h2>

        <form action="/guardar" method="POST">

            <div class="mb-3">
                <label class="form-label">Área</label>
                <input type="text" name="area" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Encargado</label>
                <input type="text" name="encargado" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Licencia/Herramienta</label>
                <input type="text" name="licencia" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">¿Para qué se usa?</label>
                <textarea name="uso" class="form-control" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de vigencia</label>
                <input type="date" name="vigencia" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Cantidad de usuarios</label>
                <input type="number" name="usuarios" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Observaciones</label>
                <textarea name="observaciones" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Guardar Información
            </button>

</html>
