<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Seguridad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="form-card">
        <div class="text-center mb-4">
            <h2 class="titulo-principal">Usuarios y Roles</h2>
            <p class="subtitulo">Completa la información de roles y datos personales</p>
        </div>

        <form action="/vista3" method="POST">
            <input type="hidden" name="id_solicitud" value="{{ id_solicitud }}">
            <input type="hidden" name="encargado" value="{{ encargado }}">
            <input type="hidden" name="area" value="{{ area }}">
            <input type="hidden" name="subarea" value="{{ subarea }}">
            <input type="hidden" name="fecha_hora" value="{{ fecha_hora }}">
            <input type="hidden" name="solicitante" value="{{ solicitante }}">
            <input type="hidden" name="licencia" value="{{ licencia }}">
            <input type="hidden" name="uso" value="{{ uso }}">
            <input type="hidden" name="tipo_herramienta" value="{{ tipo_herramienta }}">
            <input type="hidden" name="herramienta_detalle" value="{{ herramienta_detalle }}">
            <input type="hidden" name="licenciamiento" value="{{ licenciamiento }}">
            <input type="hidden" name="modo_licenciamiento" value="{{ modo_licenciamiento }}">
            <input type="hidden" name="proveedor" value="{{ proveedor }}">
            <input type="hidden" name="frecuencia" value="{{ frecuencia }}">
            <input type="hidden" name="frecuencia_otro" value="{{ frecuencia_otro }}">
            <input type="hidden" name="vigencia" value="{{ vigencia }}">
            <input type="hidden" name="usuarios" value="{{ usuarios }}">
            <input type="hidden" name="observaciones" value="{{ observaciones }}">

            <div class="mb-3">
                <label class="form-label">¿Cuántos usuarios utilizan esta herramienta en tu área? Por favor digita el número</label>
                <input type="number" min="0" name="usuarios_area" class="form-control custom-input" required>
            </div>

            <div class="mb-3">
                <label class="form-label">¿Sabes si la herramienta maneja roles, para la asignación de permisos?</label>
                <select id="roles_select" name="roles" class="form-select custom-input" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Si">Si</option>
                    <option value="No">No</option>
                    <option value="No sé">No sé</option>
                </select>
            </div>

            <div id="roles_detalle_group" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">¿Quién gestiona los roles en la compañía / área?</label>
                    <input type="text" name="gestiona_roles" class="form-control custom-input" placeholder="Nombre o área responsable">
                </div>
                <div class="mb-3">
                    <label class="form-label">¿Quién gestiona los usuarios?</label>
                    <input type="text" name="gestiona_usuarios" class="form-control custom-input" placeholder="Nombre o área responsable">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">¿Sabes si la herramienta maneja o recopila datos personales?</label>
                <select id="info_sensible_select" name="info_sensible" class="form-select custom-input" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Si">Si</option>
                    <option value="No">No</option>
                    <option value="No sé">No sé</option>
                </select>
            </div>

            <div id="tipo_info_sensible_group" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">Tipo de datos personales</label>
                    <select id="tipo_info_sensible_select" name="tipo_info_sensible" class="form-select custom-input" multiple size="6" required>
                        <option value="Datos personales (clientes)">Datos personales (clientes)</option>
                        <option value="Datos personales (empleados)">Datos personales (empleados)</option>
                        <option value="Información financiera">Información financiera</option>
                        <option value="Información comercial/estratégica">Información comercial/estratégica</option>
                        <option value="Propiedad intelectual">Propiedad intelectual</option>
                        <option value="Datos de proveedores">Datos de proveedores</option>
                        <option value="Información médica/salud">Información médica/salud</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <div class="form-text">Mantén presionada Ctrl (Windows) o Cmd (Mac) para seleccionar más de una opción.</div>
                </div>
                <div class="mb-3" id="info_sensible_otro_group" style="display: none;">
                    <label class="form-label">Escribe cuál es el tipo de datos personales</label>
                    <input type="text" id="info_sensible_otro" name="info_sensible_otro" class="form-control custom-input" placeholder="Describe el tipo de información sensible">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">¿Está la información de manejo de datos personales validada con el área de compliance?</label>
                <select name="compliance_validado" class="form-select custom-input" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Si">Si</option>
                    <option value="No">No</option>
                    <option value="No sé">No sé</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success btn-custom w-100">Siguiente</button>
        </form>
            
    </div>
</div>

<script>
    const rolesSelect = document.getElementById('roles_select');
    const rolesDetalleGroup = document.getElementById('roles_detalle_group');
    const gestionaRolesInput = document.querySelector('input[name="gestiona_roles"]');
    const gestionaUsuariosInput = document.querySelector('input[name="gestiona_usuarios"]');

    const infoSensibleSelect = document.getElementById('info_sensible_select');
    const tipoInfoSensibleGroup = document.getElementById('tipo_info_sensible_group');
    const tipoInfoSensibleSelect = document.getElementById('tipo_info_sensible_select');
    const infoSensibleOtroGroup = document.getElementById('info_sensible_otro_group');
    const infoSensibleOtroInput = document.getElementById('info_sensible_otro');

    function toggleRolesGroup() {
        const show = rolesSelect.value === 'Si';
        rolesDetalleGroup.style.display = show ? 'block' : 'none';
        gestionaRolesInput.required = show;
        gestionaUsuariosInput.required = show;
        if (!show) {
            gestionaRolesInput.value = '';
            gestionaUsuariosInput.value = '';
        }
    }

    function toggleTipoInfoSensible() {
        const show = infoSensibleSelect.value === 'Si';
        tipoInfoSensibleGroup.style.display = show ? 'block' : 'none';
        tipoInfoSensibleSelect.required = show;
        infoSensibleOtroGroup.style.display = 'none';
        infoSensibleOtroInput.required = false;
        if (!show) {
            tipoInfoSensibleSelect.value = '';
            infoSensibleOtroInput.value = '';
        }
    }

    function toggleInfoSensibleOtro() {
        const selectedValues = Array.from(tipoInfoSensibleSelect.selectedOptions).map(option => option.value);
        const show = selectedValues.includes('Otro');
        infoSensibleOtroGroup.style.display = show ? 'block' : 'none';
        infoSensibleOtroInput.required = show;
        if (!show) {
            infoSensibleOtroInput.value = '';
        }
    }

    if (rolesSelect) {
        rolesSelect.addEventListener('change', toggleRolesGroup);
        toggleRolesGroup();
    }

    if (infoSensibleSelect) {
        infoSensibleSelect.addEventListener('change', toggleTipoInfoSensible);
        infoSensibleSelect.addEventListener('change', toggleInfoSensibleOtro);
        toggleTipoInfoSensible();
    }

    if (tipoInfoSensibleSelect) {
        tipoInfoSensibleSelect.addEventListener('change', toggleInfoSensibleOtro);
        toggleInfoSensibleOtro();
    }
</script>

</body>
</html>
